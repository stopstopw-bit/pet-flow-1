<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>แบบสอบถามตั้งค่าร้าน PetFlow</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, one section per screen, sticky progress bar on top, big tap targets */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#1d2b2a; --muted:#5d6f6c; --line:#d6e0de;
  --brand:#1f6f68; --brand-ink:#ffffff; --pick:#e3f1ef; --sun:#f2b632; --danger:#b3412f;
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111917; --surface:#1a2523; --ink:#e6efed; --muted:#9db0ac; --line:#2d3b38;
  --brand:#5cc2b6; --brand-ink:#0d1a18; --pick:#21423e; --sun:#f2c45a; --danger:#ff8a75; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111917; --surface:#1a2523; --ink:#e6efed; --muted:#9db0ac; --line:#2d3b38;
  --brand:#5cc2b6; --brand-ink:#0d1a18; --pick:#21423e; --sun:#f2c45a; --danger:#ff8a75; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:640px;margin:0 auto;display:grid;gap:8px}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--display);font-weight:600;color:var(--brand);font-size:15px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .25s}
main{max-width:640px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px}
.q{display:grid;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q-label{font-weight:600;font-size:17px}
.q-hint{font-size:13px;color:var(--muted);margin-top:-6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:9px 16px;cursor:pointer;min-height:44px}
.opt[aria-pressed="true"]{background:var(--pick);border-color:var(--brand);color:var(--ink);font-weight:600}
.opt[aria-pressed="true"]::before{content:"✓ ";color:var(--brand)}
.opt:focus-visible,.field:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.field{font:inherit;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;min-height:46px}
textarea.field{min-height:84px;resize:vertical}
.num{display:flex;align-items:center;gap:10px}
.num .field{max-width:140px;font-variant-numeric:tabular-nums}
.num span{color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:600;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.main{flex:1;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:default}
.sum{display:grid;gap:14px}
.sum section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sum h3{font-family:var(--display);font-weight:500;font-size:16px;margin:0 0 8px;color:var(--brand)}
.sum dl{margin:0;display:grid;gap:6px}
.sum dt{font-size:13px;color:var(--muted)}
.sum dd{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);font-style:italic}
.msg{border-radius:12px;padding:12px 14px;background:var(--pick);margin:0 0 16px}
.msg.err{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.actions{display:grid;gap:10px;margin:18px 0}
.jump{background:none;border:0;color:var(--brand);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.num.wide .field{max-width:none}
.note-btn{justify-self:start;background:none;border:0;padding:4px 0;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.note-btn:hover{color:var(--brand)}
.note-btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.follow.note{border-left-color:var(--line)}
.follow{display:grid;gap:6px;margin-left:6px;padding:10px 0 2px 14px;border-left:3px solid var(--sun)}
.f-label{font-size:14px;font-weight:500;color:var(--ink)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.card-title{font-family:var(--display);font-weight:500;color:var(--brand)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.cf{display:grid;gap:4px;min-width:0}
.cf .num .field{max-width:none}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pgrid{border-collapse:collapse;width:100%;font-size:14px}
.pgrid th,.pgrid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.pgrid thead th{color:var(--muted);font-weight:500}
.pgrid .cell{min-width:84px;min-height:40px;padding:8px 10px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="top-row"><span class="brand">ตั้งค่าร้าน · PetFlow</span><span class="count" id="count"></span></div>
  <div class="bar"><i id="bar"></i></div>
</div></div>
<main id="main"></main>
<div class="nav"><div class="nav-in">
  <button class="btn" id="back" type="button">ย้อนกลับ</button>
  <button class="btn main" id="next" type="button">ถัดไป</button>
</div></div>

<script>
const OTHER = "อื่นๆ";
// t: one = เลือก 1 ข้อ, many = เลือกได้หลายข้อ, num = ตัวเลข, text = พิมพ์สั้น, long = พิมพ์ยาว
//    repeat = ถามชุดเดิมซ้ำตามจำนวน (เช่น ห้องแต่ละแบบ), grid = ตารางราคา
// ตัวเลือกที่ต้องถามต่อ เขียนเป็น {v: ชื่อตัวเลือก, f: คำถามต่อ, u: หน่วย, ph: ตัวอย่าง}
// ทุกข้อแบบเลือกจะมี "อื่นๆ" ต่อท้ายให้อัตโนมัติ
const A = id => state.a[id];
const has = (id, v) => { const x = A(id); return Array.isArray(x) ? x.includes(v) : x === v; };
// ร้านรับหมา แมว หรือทั้งสองอย่าง — คำว่า {p} ในคำถามจะเปลี่ยนตามที่เลือก
// ตัวเลือก/ช่องที่ใส่ only:"dog" หรือ only:"cat" จะขึ้นเฉพาะร้านที่รับสัตว์นั้น
const PETS_BOTH = "ทั้งหมาและแมว";
const isCat = () => A("pets") === "แมว" || A("pets") === PETS_BOTH;
const isDog = () => A("pets") !== "แมว";
const PET = () => A("pets") === "แมว" ? "แมว" : A("pets") === PETS_BOTH ? "หมา/แมว" : "หมา";
const T = x => String(x == null ? "" : x).replace(/\{p\}/g, PET());
const okFor = x => !x || typeof x === "string" || !x.only || (x.only === "dog" ? isDog() : isCat());
const countOf = (id, max) => { const x = A(id); if (!x) return 0; const n = parseInt(x === OTHER ? (state.other[id] || "") : x, 10); return Math.max(0, Math.min(max, n || 0)); };

const SECTIONS = [
 {title:"ข้อมูลร้าน", lead:"ข้อมูลที่ลูกค้าจะเห็นในแอปและใน LINE", qs:[

  {id:"shopName",t:"text",q:"ชื่อร้าน"},
  {id:"shopNameEn",t:"text",q:"ชื่อร้านภาษาอังกฤษ (ถ้ามี)"},
  {id:"tagline",t:"text",q:"คำโปรยใต้ชื่อร้าน",hint:"เช่น โรงแรมน้อง{p} · อาบน้ำตัดขน"},
  {id:"phone",t:"text",q:"เบอร์โทรร้าน"},
  {id:"lineOa",t:"text",q:"LINE OA ของร้าน",hint:"เช่น @myshop"},
  {id:"address",t:"long",q:"ที่อยู่ร้าน",ph:"บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด"},
  {id:"maps",t:"text",q:"ลิงก์ Google Maps ของร้าน"},
  {id:"reviewUrl",t:"text",q:"ลิงก์ให้ลูกค้ารีวิวร้าน (Google รีวิว)",hint:"ไม่มีก็เว้นไว้ได้ เดี๋ยวช่วยหาให้"},
  {id:"reviewBtn",t:"one",q:"คำบนปุ่มชวนรีวิว",o:["⭐ รีวิวให้เราหน่อยนะคะ","⭐ รีวิวให้เราหน่อยนะครับ",{v:"ช่วยรีวิวร้านหน่อยนะ 🐶",only:"dog"},{v:"ช่วยรีวิวร้านหน่อยนะ 🐱",only:"cat"}]},
  {id:"facebook",t:"text",q:"Facebook ของร้าน",hint:"ชื่อเพจหรือลิงก์ เช่น facebook.com/myshop · ไม่มีก็เว้นไว้"},

  {id:"color",t:"one",q:"สีประจำร้านที่ชอบ",o:["เขียว","ฟ้า/น้ำเงิน","ชมพู","ส้ม","น้ำตาล","ม่วง","เหลือง"]},
 ]},
 {title:"วันและเวลา", lead:"ระบบจะไม่ให้ลูกค้าจองในวันที่ร้านหยุด", qs:[

  {id:"checkout",t:"one",q:"เวลาเช็คเอาท์ห้องพัก",o:["10:00","12:00","14:00","18:00","ได้ตลอดเวลาที่ร้านเปิด"]},
  {id:"lateFee",t:"one",q:"มารับช้ากว่าเวลาเช็คเอาท์",o:[
    {v:"ไม่คิดเงินเพิ่ม",f:"ให้ช้าได้ไม่เกินกี่ชั่วโมง",u:"ชั่วโมง"},
    {v:"คิดเพิ่มเป็นชั่วโมง",f:"ชั่วโมงละกี่บาท",u:"บาท"},
    {v:"คิดเพิ่มครึ่งวัน",f:"ครึ่งวันกี่บาท และช้าเกินกี่โมงถึงนับครึ่งวัน",ph:"เช่น 200 บาท ถ้าเกิน 14:00"},
    {v:"คิดเพิ่ม 1 คืน",f:"ช้าเกินกี่โมงถึงนับเป็น 1 คืน",ph:"เช่น เกิน 18:00"}]},
  {id:"earlyIn",t:"one",q:"มาส่งก่อนเวลาเช็คอิน",o:["ไม่คิดเงินเพิ่ม",{v:"คิดเพิ่ม",f:"คิดเพิ่มเท่าไหร่",ph:"เช่น ชั่วโมงละ 50 บาท"}]},
  {id:"holidays",t:"text",q:"ช่วงปิดยาวปีนี้ (ถ้ามี)",hint:"เช่น 30 ธ.ค. – 2 ม.ค."},
 ]},
 {title:"การรับเงิน", lead:"ใช้ในใบแจ้งยอดและ QR ให้ลูกค้าโอน", qs:[
  {id:"bank",t:"one",q:"ธนาคารที่ให้ลูกค้าโอน",o:["กสิกร","ไทยพาณิชย์","กรุงเทพ","กรุงไทย","กรุงศรี","ทหารไทยธนชาต","ออมสิน"]},
  {id:"account",t:"text",q:"เลขบัญชี และชื่อบัญชี"},
  {id:"promptpay",t:"text",q:"พร้อมเพย์ (เบอร์หรือเลขบัตร)",hint:"ไม่มีก็เว้นไว้ได้"},
  {id:"payWays",t:"many",q:"ลูกค้าจ่ายเงินทางไหนได้บ้าง",o:["โอน/สแกน QR","เงินสด",{v:"บัตรเครดิต",f:"มีค่าธรรมเนียมบัตรไหม กี่ %",u:"%"}]},

    {v:"เก็บมัดจำห้องพัก",f:"มัดจำห้องพักเท่าไหร่",ph:"เช่น 500 บาท หรือ 30% ของยอด"},
    {v:"เก็บมัดจำคิวอาบน้ำ",f:"มัดจำอาบน้ำเท่าไหร่",ph:"เช่น 200 บาท"}]},
  {id:"payFull",t:"one",q:"ห้องพักต้องจ่ายส่วนที่เหลือเมื่อไหร่",o:["จ่ายตอนเช็คอิน","จ่ายตอนเช็คเอาท์",{v:"จ่ายก่อนเข้าพัก",f:"ก่อนเข้าพักกี่วัน",u:"วัน"}]},
  {id:"refund",t:"one",q:"ยกเลิกแล้วคืนมัดจำไหม",o:[

    {v:"คืนถ้าแจ้งล่วงหน้า",f:"ต้องแจ้งล่วงหน้ากี่วัน และคืนกี่ %",ph:"เช่น 7 วัน คืน 100%"},
    "ไม่คืนทุกกรณี"]},
  {id:"tax",t:"one",q:"ต้องออกใบเสร็จแบบไหน",o:["ใบเสร็จธรรมดาพอ",

 ]},
 {title:"ห้องพักน้อง{p}", lead:"ห้องแต่ละแบบตั้งราคาแยกกันได้", qs:[

  {id:"rooms",t:"repeat",q:"ห้องแต่ละแบบ",item:"ห้องแบบที่",n:()=>countOf("roomTypes",10),fields:[
    {k:"name",l:"ชื่อห้อง",ph:"เช่น ห้องเล็ก"},
    {k:"count",l:"มีกี่ห้อง",u:"ห้อง",num:1},
    {k:"price",l:"ราคาต่อคืน",u:"บาท",num:1},
    {k:"dogSize",l:"เหมาะกับหมาหนักไม่เกิน",u:"กก.",num:1,only:"dog"},
    {k:"size",l:"ขนาดห้อง (กว้าง×ยาว)",ph:"เช่น 1×1.5 ม."},
    {k:"maxDogs",l:"{p}บ้านเดียวกันนอนรวมได้สูงสุด",u:"ตัว",num:1},
    {k:"included",l:"ราคานี้รวม{p}กี่ตัว",u:"ตัว",num:1},
    {k:"extra",l:"ตัวที่เกิน คิดเพิ่มคืนละ",u:"บาท",num:1},
    {k:"note",l:"จุดเด่นของห้องนี้",ph:"เช่น ห้องติดกระจก เห็นวิว มีกล้อง"}]},
  {id:"catRoom",t:"many",q:"ห้องแมวมีอะไรบ้าง",show:isCat,o:["กระบะทราย","คอนโด/ที่ปีนป่าย","ที่ลับเล็บ","ชั้นนอนสูง","หน้าต่างดูวิว"]},
  {id:"litter",t:"one",q:"ทรายแมวระหว่างฝาก",show:isCat,o:["ลูกค้าเอามาเอง","ร้านมีให้ ฟรี",{v:"ร้านมีให้ คิดเงินเพิ่ม",f:"วันละกี่บาท",u:"บาท"}]},
  {id:"inRoom",t:"many",q:"ห้องพักมีอะไรให้บ้าง",o:["แอร์","กล้องดูออนไลน์","ที่นอน","ชามน้ำ/อาหาร",

 {title:"เชื่อมระบบและข้อมูลเก่า", lead:"ข้อสุดท้ายแล้ว", qs:[
  {id:"pics",t:"many",q:"มีรูปอะไรจะส่งมาให้บ้าง (ส่งทาง LINE)",o:["โลโก้ร้าน","รูปห้องพัก","รูปเมนูราคาอาบน้ำ","โปสเตอร์กฎการฝาก","รูปผลงานอาบน้ำตัดขน","QR พร้อมเพย์"],hint:"ใช้ทำหน้าร้านในแอป"},
  {id:"lineReady",t:"one",q:"มี LINE OA แล้วหรือยัง",o:["มีแล้ว","ยังไม่มี"]},
  {id:"notify",t:"many",q:"อยากให้แจ้งเตือนร้านทางไหน เมื่อมีจองใหม่",o:["ไม่ต้อง","LINE","Telegram",{v:"Google Calendar",f:"ใช้อีเมลอะไร (ใส่ได้หลายอีเมล)"}]},
  {id:"oldData",t:"one",q:"ตอนนี้จดลูกค้าและนัดไว้ที่ไหน",o:["สมุด","Excel / Google Sheets",{v:"แอปอื่น",f:"แอปอะไร"},"ยังไม่มีลูกค้า"]},
  {id:"moveData",t:"one",q:"อยากย้ายข้อมูลลูกค้าเก่าเข้าระบบไหม",o:[{v:"อยาก",f:"ลูกค้าเก่าประมาณกี่คน และมีคอร์ส/เครดิตค้างไหม",ph:"เช่น 300 คน มีคอร์สค้าง 20 คน"},"ไม่ต้อง เริ่มใหม่"]},
  {id:"wish",t:"long",q:"อยากให้ระบบช่วยเรื่องอะไรมากที่สุด"},
 ]},
];
// ทุกข้อแบบเลือก มี "อื่นๆ" ให้พิมพ์เอง
SECTIONS.forEach(s => s.qs.forEach(q => { if ((q.t==="one"||q.t==="many") && !q.o.some(o => (o.v||o) === OTHER)) q.o.push(OTHER); }));
const ALLQ = SECTIONS.flatMap(s => s.qs);
const optV = o => typeof o === "string" ? o : o.v;
const optsOf = q => q.o.filter(okFor);
const fieldsOf = q => q.fields.filter(okFor);
const fKey = (qid, v) => qid + "~" + v;

// ลิงก์ของแต่ละร้านคือ /s/<slug>/shop-questions — แนบ slug ไปกับคำตอบให้ผูกกับร้านนั้น
const SLUG = ((location.pathname.match(/^\/s\/([a-z0-9-]+)\//i) || [])[1] || "").toLowerCase();
// แยกที่เก็บร่างคำตอบต่อร้าน กันเปิดลิงก์สองร้านในเครื่องเดียวแล้วคำตอบปนกัน
const KEY = "petflow-shop-questions-v1" + (SLUG ? ":" + SLUG : "");
let state = {a:{}, other:{}, note:{}, open:{}, step:0};
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.a) state = Object.assign(state, s); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

const main = document.getElementById("main");
const TOTAL = SECTIONS.length; // ขั้นสุดท้าย (index TOTAL) = สรุป
let submitted = false;
// รหัสชุดคำตอบนี้ — ส่งซ้ำหลังแก้ไข จะทับชุดเดิม ไม่เกิดแถวซ้ำ
if (!state.sid) { state.sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2); save(); }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const visible = q => !q.show || q.show();

function gridRows(){
  const v = Array.isArray(A("services")) ? A("services") : [];
  const rows = v.filter(x => x !== OTHER);
  if (v.includes(OTHER)) (state.other.services || "").split(/[,\n]/).map(x => x.trim()).filter(Boolean).forEach(x => rows.push(x));
  return rows;
}
function gridCols(){
  const n = countOf("sizeCount", 8);
  return Array.from({length:n}, (_,i) => (A(`sizes.${i}.name`) || "").trim() || `ไซส์ ${i+1}`);
}

function answerText(q){
  if (q.t === "repeat") {
    const n = q.n(); const out = [];
    for (let i = 0; i < n; i++) {
      const parts = fieldsOf(q).map(f => { const x = (A(`${q.id}.${i}.${f.k}`) || "").trim(); return x ? `${T(f.l)} ${x}${f.u ? " " + f.u : ""}` : ""; }).filter(Boolean);
      if (parts.length) out.push(`${q.item} ${i+1}: ` + parts.join(" · "));
    }
    return out.join("\n");
  }
  if (q.t === "grid") {
    const rows = gridRows(), cols = gridCols(); const out = [];
    rows.forEach((r,ri) => { const parts = cols.map((c,ci) => { const x = (A(`prices.${ri}.${ci}`) || "").trim(); return x ? `${c} ${x}` : ""; }).filter(Boolean); if (parts.length) out.push(`${r}: ` + parts.join(" / ")); });
    return out.join("\n");
  }
  const v = A(q.id);
  if (v == null || v === "" || (Array.isArray(v) && !v.length)) return "";
  // ตัวเลือกของสัตว์ที่ร้านไม่ได้รับ (เคยเลือกไว้ก่อนเปลี่ยนข้อแรก) ไม่ต้องนับ
  const picked = (Array.isArray(v) ? v : [String(v)]).filter(p => okFor((q.o || []).find(o => optV(o) === p)));
  const parts = picked.map(p => {
    if (p === OTHER) { const o = (state.other[q.id] || "").trim(); return o ? OTHER + ": " + o : OTHER; }
    const opt = (q.o || []).find(o => optV(o) === p);
    const d = opt && opt.f ? (A(fKey(q.id, p)) || "").trim() : "";
    return d ? `${T(p)} (${T(opt.f)}: ${d}${opt.u ? " " + opt.u : ""})` : T(p);
  });
  return parts.join(", ") + (q.t === "num" && q.unit ? " " + q.unit : "");
}

function fullText(q){
  const t = answerText(q), n = (state.note[q.id] || "").trim();
  return n ? (t ? t + "\n" : "") + "หมายเหตุ: " + n : t;
}

function fieldBox(id, key, val, unit, ph, num){
  return `<div class="num${unit ? "" : " wide"}"><input class="field" id="${id}" data-f="${esc(key)}"${num ? ' inputmode="decimal"' : ""} placeholder="${esc(ph || "")}" value="${esc(val || "")}">${unit ? `<span>${esc(unit)}</span>` : ""}</div>`;
}

function renderQ(q){
  if (!visible(q)) return "";
  const v = A(q.id);
  let h = `<div class="q"><div class="q-label" id="l-${q.id}">${esc(T(q.q))}${q.t==="many"?' <span class="q-hint">(เลือกได้หลายข้อ)</span>':""}</div>`;
  if (q.hint) h += `<div class="q-hint">${esc(T(q.hint))}</div>`;
  if (q.t === "one" || q.t === "many") {
    h += `<div class="opts" role="group" aria-labelledby="l-${q.id}">` + q.o.map((o,i) => {
      if (!okFor(o)) return "";
      const ov = optV(o);
      const on = q.t === "one" ? v === ov : Array.isArray(v) && v.includes(ov);
      return `<button type="button" class="opt" id="o-${q.id}-${i}" data-q="${q.id}" data-o="${esc(ov)}" aria-pressed="${on}">${esc(T(ov))}</button>`;
    }).join("") + `</div>`;
    q.o.forEach((o,i) => {
      const ov = optV(o);
      if (typeof o === "string" || !o.f || !okFor(o) || !has(q.id, ov)) return;
      h += `<div class="follow"><label class="f-label" for="fu-${q.id}-${i}">${esc(T(ov))}: ${esc(T(o.f))}</label>${fieldBox(`fu-${q.id}-${i}`, fKey(q.id, ov), A(fKey(q.id, ov)), o.u, o.ph, !!o.u)}</div>`;
    });
    if (has(q.id, OTHER)) h += `<div class="follow"><label class="f-label" for="other-${q.id}">${["roomTypes","sizeCount","staffCount"].includes(q.id) ? "พิมพ์จำนวน" : "อื่นๆ พิมพ์เพิ่ม"}</label><input class="field" id="other-${q.id}" data-other="${q.id}" value="${esc(state.other[q.id] || "")}"></div>`;
  } else if (q.t === "repeat") {
    const n = q.n();
    if (!n) h += `<div class="q-hint">เลือกจำนวนในข้อด้านบนก่อน</div>`;
    for (let i = 0; i < n; i++) {
      h += `<div class="card"><div class="card-title">${esc(q.item)} ${i+1}</div><div class="card-grid">` + fieldsOf(q).map(f =>
        `<div class="cf"><label class="f-label" for="r-${q.id}-${i}-${f.k}">${esc(T(f.l))}</label>${fieldBox(`r-${q.id}-${i}-${f.k}`, `${q.id}.${i}.${f.k}`, A(`${q.id}.${i}.${f.k}`), f.u, f.ph, f.num)}</div>`).join("") + `</div></div>`;
    }
  } else if (q.t === "grid") {
    const rows = gridRows(), cols = gridCols();
    if (!rows.length || !cols.length) h += `<div class="q-hint">เลือกบริการ และจำนวนไซส์ด้านบนก่อน แล้วตารางจะขึ้นตรงนี้</div>`;
    else h += `<div class="grid-wrap"><table class="pgrid"><thead><tr><th>บริการ</th>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
      rows.map((r,ri) => `<tr><th scope="row">${esc(r)}</th>${cols.map((c,ci) => `<td><input class="field cell" id="g-${ri}-${ci}" data-f="prices.${ri}.${ci}" inputmode="decimal" aria-label="${esc(r)} ${esc(c)}" value="${esc(A(`prices.${ri}.${ci}`) || "")}"></td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
  } else if (q.t === "num") {
    h += fieldBox(`f-${q.id}`, q.id, v, q.unit, q.ph, true);
  } else if (q.t === "long") {
    h += `<textarea class="field" id="f-${q.id}" data-f="${q.id}" placeholder="${esc(q.ph || "")}">${esc(v || "")}</textarea>`;
  } else {
    h += `<input class="field" id="f-${q.id}" data-f="${q.id}" placeholder="${esc(q.ph || "")}" value="${esc(v || "")}">`;
  }
  const nv = state.note[q.id] || "";
  if (nv || state.open[q.id]) h += `<div class="follow note"><label class="f-label" for="n-${q.id}">หมายเหตุ</label><textarea class="field" id="n-${q.id}" data-note="${q.id}" placeholder="อธิบายเพิ่มเติมได้ตามสบาย">${esc(nv)}</textarea></div>`;
  else h += `<button type="button" class="note-btn" data-addnote="${q.id}">+ เขียนหมายเหตุ</button>`;
  return h + `</div>`;
}

function summaryText(){
  const shop = A("shopName") || "(ยังไม่ใส่ชื่อร้าน)";
  let out = `คำตอบตั้งค่าร้าน: ${shop}\n`;
  SECTIONS.forEach(s => {
    const lines = s.qs.filter(visible).map(q => [q, fullText(q)]).filter(([,t]) => t);
    if (!lines.length) return;
    out += `\n【${T(s.title)}】\n` + lines.map(([q,t]) => t.includes("\n") ? `• ${T(q.q)}:\n  ${t.replace(/\n/g, "\n  ")}` : `• ${T(q.q)}: ${t}`).join("\n") + "\n";
  });
  return out;
}

function render(){
  const step = state.step;
  document.getElementById("bar").style.width = Math.round(step / TOTAL * 100) + "%";
  document.getElementById("count").textContent = step < TOTAL ? `หมวด ${step+1} จาก ${TOTAL}` : "สรุปคำตอบ";
  document.getElementById("back").disabled = step === 0;
  const next = document.getElementById("next");
  if (step < TOTAL) {
    const s = SECTIONS[step];
    main.innerHTML = (step === 0 ? `<p class="msg">ตอบเท่าที่รู้ ข้ามข้อที่ยังไม่แน่ใจได้เลย ถ้าไม่มีตัวเลือกที่ตรง กด "อื่นๆ" แล้วพิมพ์เองได้ทุกข้อ คำตอบจะจำไว้ในเครื่องนี้ ปิดแล้วกลับมาทำต่อได้</p>` : "")
      + `<h1>${esc(T(s.title))}</h1>` + (s.lead ? `<p class="lead">${esc(s.lead)}</p>` : "") + s.qs.map(renderQ).join("");
    next.hidden = false; next.textContent = step === TOTAL - 1 ? "ดูสรุปคำตอบ" : "ถัดไป";
  } else {
    next.hidden = true;
    const blocks = SECTIONS.map((s,si) => {
      const rows = s.qs.filter(visible).map(q => { const t = fullText(q); return `<dt>${esc(T(q.q))}</dt><dd>${t ? esc(t) : '<span class="empty">ยังไม่ตอบ</span>'}</dd>`; }).join("");
      return `<section><h3>${esc(T(s.title))} <button class="jump" type="button" data-jump="${si}">แก้ไข</button></h3><dl>${rows}</dl></section>`;
    }).join("");
    main.innerHTML = `<h1>ตรวจคำตอบแล้วกดส่ง</h1>
      <p class="lead">ถ้ากดส่งไม่ได้ ให้กด "คัดลอกคำตอบ" แล้ววางส่งใน LINE แทน</p>
      <div id="status"></div>
      <div class="actions">
        <button class="btn main" id="send" type="button">${submitted ? "ส่งอีกครั้ง (แก้ไขแล้ว)" : "ส่งคำตอบ"}</button>
        <button class="btn" id="copy" type="button">คัดลอกคำตอบ</button>
      </div>
      <textarea class="field" id="copybox" rows="8" readonly hidden></textarea>
      <div class="sum">${blocks}</div>`;
  }
  window.scrollTo(0,0);
}

function setStatus(html, err){ const el = document.getElementById("status"); if (el) el.innerHTML = `<p class="msg${err?" err":""}">${html}</p>`; }

main.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.q) {
    const q = ALLQ.find(x => x.id === b.dataset.q), o = b.dataset.o;
    if (q.t === "one") state.a[q.id] = state.a[q.id] === o ? "" : o;
    else { const cur = Array.isArray(state.a[q.id]) ? state.a[q.id] : []; state.a[q.id] = cur.includes(o) ? cur.filter(x => x !== o) : cur.concat(o); }
    save();
    const y = window.scrollY; render(); window.scrollTo(0,y);
    document.getElementById(b.id)?.focus({preventScroll:true});
    if (has(q.id, o)) {
      const i = q.o.findIndex(x => optV(x) === o);
      (document.getElementById(o === OTHER ? "other-" + q.id : `fu-${q.id}-${i}`))?.focus({preventScroll:true});
    }
  } else if (b.dataset.addnote) {
    const id = b.dataset.addnote; state.open[id] = true; save();
    const y = window.scrollY; render(); window.scrollTo(0,y);
    document.getElementById("n-" + id)?.focus({preventScroll:true});
  } else if (b.dataset.jump) { state.step = +b.dataset.jump; save(); render(); }
  else if (b.id === "copy") {
    // เบราว์เซอร์ในแอป (LINE/Facebook) มักไม่ให้ใช้ clipboard API หรือบอกว่าสำเร็จแต่ไม่ได้คัดลอกจริง
    // จึงโชว์ข้อความไว้ในกล่องเสมอ แล้วลองคัดลอกจากกล่อง (execCommand ต้องเรียกทันทีตอนกด) ก่อนค่อยลอง API
    const text = summaryText();
    const box = document.getElementById("copybox");
    box.hidden = false; box.value = text; box.focus(); box.select(); box.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(err){}
    if (!ok && navigator.clipboard) { try { await navigator.clipboard.writeText(text); ok = true; } catch(err){} }
    setStatus(ok ? "คัดลอกแล้ว ไปวางส่งใน LINE ได้เลย ถ้าวางแล้วไม่มีอะไร กดค้างที่ข้อความด้านล่าง แล้วเลือกคัดลอก" : "กดค้างที่ข้อความด้านล่าง แล้วเลือกคัดลอก");
  } else if (b.id === "send") {
    b.disabled = true; b.textContent = "กำลังส่ง…";
    try {
      const res = await fetch("/api/shop-questions", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({id: state.sid, slug: SLUG, shopName: A("shopName") || "", answers: {a: state.a, other: state.other, note: state.note}, text: summaryText()})});
      if (!res.ok) throw new Error("HTTP " + res.status);
      submitted = true; render(); setStatus("ส่งคำตอบแล้ว ขอบคุณค่ะ ทีมงานจะนำไปตั้งค่าร้านให้");
    } catch(err){ render(); setStatus("ส่งไม่สำเร็จ กด \"คัดลอกคำตอบ\" แล้ววางส่งใน LINE แทนได้เลย", true); }
  }
});
// ช่องที่ทำให้ตาราง/การ์ดเปลี่ยน (จำนวน, ชื่อไซส์, บริการอื่นๆ) วาดหน้าใหม่ตอนออกจากช่อง
const RERENDER = /^(sizes\.\d+\.name)$/;
const RERENDER_OTHER = ["roomTypes","sizeCount","staffCount","services"];
main.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f) { state.a[t.dataset.f] = t.value; save(); }
  else if (t.dataset.note) { state.note[t.dataset.note] = t.value; save(); }
  else if (t.dataset.other) { state.other[t.dataset.other] = t.value; save(); }
});
main.addEventListener("change", e => {
  const t = e.target;
  if ((t.dataset.f && RERENDER.test(t.dataset.f)) || (t.dataset.other && RERENDER_OTHER.includes(t.dataset.other))) {
    const y = window.scrollY; render(); window.scrollTo(0,y);
  }
});
document.getElementById("next").addEventListener("click", () => { if (state.step < TOTAL) { state.step++; save(); render(); } });
document.getElementById("back").addEventListener("click", () => { if (state.step > 0) { state.step--; save(); render(); } });
render();
</script>

</body>
</html>
